<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">RRDB-based 4x GAN super-resolution architecture</title>
  <desc id="desc">Low-resolution image enters a generator with input convolution, sixteen RRDB blocks and a long residual skip connection, then two PixelShuffle 2x upsampling stages and output reconstruction. A PatchGAN discriminator compares real high-resolution images and generated super-resolved images during training.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111d32"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#5b21b6"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#115e59"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a9bdd8"/></marker>
    <style>
      .heading{font:700 27px Arial,sans-serif;fill:#f8fafc}.sub{font:400 15px Arial,sans-serif;fill:#a9bdd8}
      .label{font:700 17px Arial,sans-serif;fill:#fff}.small{font:400 14px Arial,sans-serif;fill:#e2e8f0}
      .tiny{font:400 12px Arial,sans-serif;fill:#cbd5e1}.line{stroke:#a9bdd8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .skip{stroke:#fbbf24;stroke-width:3;fill:none;marker-end:url(#arrow)}.panel{fill:#152238;stroke:#314663;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="820" rx="24" fill="url(#bg)"/>
  <text x="48" y="54" class="heading">4× GAN Image Super-Resolution</text>
  <text x="48" y="82" class="sub">RRDB-based generator · two-stage PixelShuffle upsampling · PatchGAN discriminator</text>

  <rect x="35" y="115" width="1130" height="420" rx="18" class="panel"/>
  <text x="60" y="151" class="heading" style="font-size:21px">Generator</text>
  <text x="60" y="174" class="sub">Inference path: low-resolution input → 4× super-resolved output</text>

  <!-- Main generator path -->
  <rect x="65" y="265" width="145" height="90" rx="12" fill="#26364d" stroke="#64748b"/>
  <text x="137" y="297" text-anchor="middle" class="label">Low-resolution</text>
  <text x="137" y="321" text-anchor="middle" class="small">input image</text>
  <text x="137" y="341" text-anchor="middle" class="tiny">H × W × 3</text>

  <path d="M210 310 H248" class="line"/>
  <rect x="252" y="265" width="135" height="90" rx="12" fill="url(#blue)"/>
  <text x="319" y="300" text-anchor="middle" class="label">Input</text>
  <text x="319" y="322" text-anchor="middle" class="label">convolution</text>
  <text x="319" y="341" text-anchor="middle" class="tiny">64 features</text>

  <path d="M387 310 H423" class="line"/>
  <rect x="427" y="245" width="190" height="130" rx="14" fill="url(#purple)"/>
  <text x="522" y="282" text-anchor="middle" class="label">16 × RRDB</text>
  <text x="522" y="307" text-anchor="middle" class="small">Residual-in-Residual</text>
  <text x="522" y="328" text-anchor="middle" class="small">Dense Blocks</text>
  <text x="522" y="351" text-anchor="middle" class="tiny">64 feature channels</text>

  <path d="M617 310 H652" class="line"/>
  <rect x="656" y="265" width="140" height="90" rx="12" fill="url(#blue)"/>
  <text x="726" y="300" text-anchor="middle" class="label">Feature</text>
  <text x="726" y="322" text-anchor="middle" class="label">convolution</text>
  <text x="726" y="341" text-anchor="middle" class="tiny">long skip merge</text>

  <path d="M796 310 H823" class="line"/>
  <rect x="827" y="252" width="130" height="116" rx="12" fill="url(#teal)"/>
  <text x="892" y="282" text-anchor="middle" class="label">Upsample 1</text>
  <text x="892" y="308" text-anchor="middle" class="small">PixelShuffle</text>
  <text x="892" y="332" text-anchor="middle" class="label">×2</text>
  <text x="892" y="352" text-anchor="middle" class="tiny">H×2, W×2</text>

  <path d="M957 310 H982" class="line"/>
  <rect x="986" y="252" width="130" height="116" rx="12" fill="url(#teal)"/>
  <text x="1051" y="282" text-anchor="middle" class="label">Upsample 2</text>
  <text x="1051" y="308" text-anchor="middle" class="small">PixelShuffle</text>
  <text x="1051" y="332" text-anchor="middle" class="label">×2</text>
  <text x="1051" y="352" text-anchor="middle" class="tiny">H×4, W×4</text>

  <path d="M1051 368 V405 H1035" class="line"/>
  <rect x="894" y="405" width="222" height="76" rx="12" fill="#334155" stroke="#94a3b8"/>
  <text x="1005" y="435" text-anchor="middle" class="label">Output reconstruction</text>
  <text x="1005" y="458" text-anchor="middle" class="small">4× super-resolved image</text>

  <!-- Long residual skip connection -->
  <path d="M319 265 V205 H726 V265" class="skip"/>
  <text x="520" y="196" text-anchor="middle" style="font:700 14px Arial;fill:#fbbf24">Long residual skip connection</text>
  <text x="60" y="511" class="tiny">Conceptual architecture based on the published paper's generator pipeline; diagram is a simplified redrawing.</text>

  <!-- Training discriminator panel -->
  <rect x="35" y="558" width="1130" height="220" rx="18" class="panel"/>
  <text x="60" y="594" class="heading" style="font-size:21px">Adversarial training path</text>
  <text x="60" y="617" class="sub">The discriminator is used during training; normal inference uses the generator.</text>

  <rect x="75" y="650" width="205" height="78" rx="12" fill="#26364d" stroke="#64748b"/>
  <text x="177" y="679" text-anchor="middle" class="label">Real HR image</text>
  <text x="177" y="702" text-anchor="middle" class="small">ground-truth target</text>

  <rect x="370" y="650" width="205" height="78" rx="12" fill="#26364d" stroke="#64748b"/>
  <text x="472" y="679" text-anchor="middle" class="label">Generated SR image</text>
  <text x="472" y="702" text-anchor="middle" class="small">from generator</text>

  <path d="M280 689 H625" class="line"/>
  <path d="M575 689 H625" class="line"/>
  <rect x="630" y="640" width="235" height="98" rx="12" fill="url(#purple)"/>
  <text x="747" y="674" text-anchor="middle" class="label">PatchGAN</text>
  <text x="747" y="697" text-anchor="middle" class="label">discriminator</text>
  <text x="747" y="719" text-anchor="middle" class="tiny">local patch realism</text>
  <path d="M865 689 H902" class="line"/>
  <rect x="907" y="650" width="215" height="78" rx="12" fill="#334155" stroke="#94a3b8"/>
  <text x="1014" y="679" text-anchor="middle" class="label">Adversarial signal</text>
  <text x="1014" y="702" text-anchor="middle" class="small">helps train generator</text>
</svg>
